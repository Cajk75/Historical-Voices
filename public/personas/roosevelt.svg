<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Eleanor Roosevelt portrait">
  <defs>
    <linearGradient id="bgr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8f74"/>
      <stop offset="1" stop-color="#1c5a49"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgr)"/>
  <!-- hair (waved) -->
  <path d="M110 165 Q100 70 200 66 Q300 70 290 165 Q285 110 255 100 Q230 130 200 118 Q170 130 145 100 Q115 110 110 165Z" fill="#8a7f74"/>
  <!-- face -->
  <ellipse cx="200" cy="170" rx="80" ry="90" fill="#ecdccb"/>
  <!-- eyes -->
  <ellipse cx="172" cy="165" rx="8" ry="6" fill="#3a3228"/>
  <ellipse cx="228" cy="165" rx="8" ry="6" fill="#3a3228"/>
  <!-- gentle smile -->
  <path d="M175 205 Q200 220 225 205" stroke="#9a6b5a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- pearls -->
  <path d="M150 270 Q200 300 250 270" stroke="none" fill="none"/>
  <g fill="#f7f3ea">
    <circle cx="150" cy="272" r="7"/><circle cx="172" cy="285" r="7"/>
    <circle cx="200" cy="290" r="7"/><circle cx="228" cy="285" r="7"/>
    <circle cx="250" cy="272" r="7"/>
  </g>
  <!-- collar/dress -->
  <path d="M130 305 Q200 270 270 305 L270 400 L130 400Z" fill="#3a6b8f"/>
</svg>
